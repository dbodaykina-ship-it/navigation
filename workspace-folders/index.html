async function open(pw){
  const km=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
  const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:dec(SALT),iterations:ITER,hash:'SHA-256'},km,{name:'AES-GCM',length:256},false,['decrypt']);
  const buf=await crypto.subtle.decrypt({name:'AES-GCM',iv:dec(IV)},key,dec(DATA));
  return new TextDecoder().decode(buf);
}
document.getElementById('f').addEventListener('submit',async e=>{
  e.preventDefault();
  const err=document.getElementById('err'), btn=document.getElementById('go');
  err.textContent=''; btn.disabled=true; btn.textContent='Проверка…';
  try{
    const doc=await open(document.getElementById('pw').value);
    document.open(); document.write(doc); document.close();
  }catch(_){
    err.textContent='Неверный пароль'; btn.disabled=false; btn.textContent='Открыть';
    document.getElementById('pw').select();
  }
});
